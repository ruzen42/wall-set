name:                backgroundSet
version:             0.1.0.0
github:              "ruzen42/backgroundSet"
license:             BSD-3-Clause
author:              "Jaroslav Mihajlenko"
maintainer:          "malledeferlive@gmail.com"
copyright:           "2025 @Ruzen42"

extra-source-files:
- README.md
- CHANGELOG.md

category:            System 

description:         Please see the README on GitHub at <https://github.com/ruzen42/backgroundSet#readme>

dependencies:
- base >= 4.7 && < 5
- process >= 1.6.25.0
- random 
- filepath >= 1.5.4.0
- directory >= 1.3.8.5
- optparse-applicative >= 0.19.0.0

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  background-set:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - backgroundSet
